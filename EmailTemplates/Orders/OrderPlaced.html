<h2>{{HeaderTitle}}</h2>
<p>Hello {{CustomerName}},</p>
<p>{{IntroMessage}}</p>
<div style="background-color: #f8fafc; padding: 20px; border-radius: 6px; margin: 20px 0;">
    <strong>Order Details:</strong><br>
    Order Number: {{OrderNumber}}<br>
    Order Date: {{OrderDate}}<br>
    Total Amount: {{TotalAmount}} INR<br>
    Shipping Charge: {{ShippingCharge}} INR<br>
    Discount Applied: {{Discount}} INR<br>
    <strong>Final Amount Paid: {{FinalAmount}} INR</strong>
</div>
<div style="text-align: center;">
    <a href="{{TrackOrderUrl}}" class="button">{{ButtonText}}</a>
</div>
