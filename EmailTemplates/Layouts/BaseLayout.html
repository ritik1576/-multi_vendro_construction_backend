<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraMart Notification</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6fa;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper {
            width: 100%;
            background-color: #f4f6fa;
            padding: 40px 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header p {
            color: rgba(255, 255, 255, 0.8);
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        .content {
            padding: 40px 30px;
            color: #333333;
            line-height: 1.6;
            font-size: 16px;
        }
        .footer {
            background-color: #fcfdfe;
            border-top: 1px solid #eeeeee;
            padding: 25px 30px;
            text-align: center;
            font-size: 12px;
            color: #777777;
        }
        .footer p {
            margin: 5px 0;
        }
        .footer a {
            color: #1e3c72;
            text-decoration: none;
            font-weight: 600;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(30, 60, 114, 0.2);
        }
        .info-box {
            background-color: #f7f9fc;
            border-left: 4px solid #1e3c72;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 0 6px 6px 0;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <h1>InfraMart</h1>
                <p>Your Trusted Construction Marketplace Partner</p>
            </div>
            <div class="content">
                {{EmailBody}}
            </div>
            <div class="footer">
                <p>&copy; {{CurrentYear}} InfraMart. All rights reserved.</p>
                <p>Need support? Contact us at <a href="mailto:{{SupportEmail}}">{{SupportEmail}}</a></p>
            </div>
        </div>
    </div>
</body>
</html>
